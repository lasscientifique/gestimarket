[package]
name = "console-eden-dev"
version = "1.1.0"
description = "Console Eden Dev — administration de GestiMarket, réservée à Eden Dev"
authors = ["Eden Dev"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "console_eden_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# « Enregistrer sous » (CSV, fichier de licence) ; sur Android, écriture dans le fichier choisi (adresse content://).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Liens WhatsApp (relances, client à qui demander d'écrire).
tauri-plugin-opener = "2"
# Alertes (Console 1.1) : notification du système quand une alerte arrive.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PC : mise à jour en un clic, signée par Eden Dev (même clé que GestiMarket), puis redémarrage.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
