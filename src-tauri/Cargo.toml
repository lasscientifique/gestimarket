[package]
name = "gestimarket"
version = "0.19.0"
description = "GestiMarket — logiciel de gestion de supermarché et de boutiques"
authors = ["GestiMarket"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "gestimarket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Fichiers choisis dans les boîtes de dialogue d'Android (adresses « content:// ») et d'iOS : export, import, sauvegarde.
tauri-plugin-fs = "2"
# Liens WhatsApp, e-mail et appel (Paramètres → Développeur Eden Dev) sur téléphone et tablette.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
chrono = "0.4"
thiserror = "2"
base64 = "0.22"
axum = "0.8"
# Compression gzip / brotli des réponses : interface et données plus rapides sur téléphone en 4G (tunnel).
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Licences : signature Ed25519 vérifiée hors ligne, identifiant du PC.
ed25519-dalek = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Android et iOS : lecture des codes-barres et QR codes par la caméra du téléphone (vue native).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Le hachage Argon2 est très lent sans optimisation : on optimise ces dépendances même en debug.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
