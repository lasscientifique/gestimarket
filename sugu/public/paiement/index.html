<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paiement GestiMarket</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --ink: #1d2433; --muted: #5b6475; --ok: #1f8a4c; --ko: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12151b; --card: #1b2029; --ink: #e8ebf0; --muted: #a3abb8; --ok: #4cc27f; --ko: #f07167; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 440px; background: var(--card); border-radius: 14px; padding: 28px 22px; text-align: center;
           box-shadow: 0 2px 14px rgba(0, 0, 0, .08); }
    h1 { font-size: 1.35rem; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 8px 0; }
    .icon { font-size: 44px; line-height: 1; }
    .ok .icon, .ok h1 { color: var(--ok); }
    .ko .icon, .ko h1 { color: var(--ko); }
    small { display: block; margin-top: 18px; color: var(--muted); }
  </style>
</head>
<body>
  <main id="page" class="ok">
    <div class="icon" id="icon">✓</div>
    <h1 id="title">Paiement reçu</h1>
    <p id="text">Merci ! Eden Dev vérifie le paiement auprès de CinetPay. Retournez dans GestiMarket : l'abonnement s'active tout seul
      dans quelques minutes. Pour une carte de bon, elle arrive sur votre WhatsApp.</p>
    <small>GestiMarket · Eden Dev — vous pouvez fermer cette page.</small>
  </main>
  <script>
    // Page de retour de CinetPay (?r=ok ou ?r=ko). Le paiement n'est jamais validé ici : Eden Dev le vérifie elle-même.
    if (new URLSearchParams(location.search).get("r") === "ko") {
      document.getElementById("page").className = "ko";
      document.getElementById("icon").textContent = "✕";
      document.getElementById("title").textContent = "Paiement non terminé";
      document.getElementById("text").textContent =
        "Le paiement a été annulé ou refusé. Aucun montant n'est retenu par Eden Dev. Vous pouvez réessayer depuis GestiMarket, ou payer avec une carte de bon.";
    }
  </script>
</body>
</html>
