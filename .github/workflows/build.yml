# Compile GestiMarket pour Windows, Linux et macOS.
# - À chaque push : tests Rust + vérification TypeScript.
# - Sur un tag « v* » (ex. v0.1.0) : génération des installateurs et brouillon de release GitHub.
name: Build

on:
  push:
    branches: [main, essai-mobile]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - name: Traductions (anglais)
        run: node scripts/i18n.mjs check && python3 scripts/i18n_messages.py --check
      - name: cargo test
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --color never 2>&1 | tee ../cargo-test.log
      # Erreurs de compilation et tests en échec recopiés en annotations : lisibles sans connexion à GitHub.
      - name: Erreurs Rust (annotations)
        if: failure()
        run: |
          msg=$(grep -E -A16 '^(error(\[E[0-9]+\])?:|---- .* stdout ----|thread .* panicked)' cargo-test.log | head -200 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=cargo test::${msg:-voir le journal}"

  # Le code propre à Windows (impression directe par la file d'impression, explorateur) n'est pas compilé
  # par les tests Ubuntu : sa compilation est vérifiée sur Windows à chaque push, avant toute version.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx vite build
      - name: cargo check (Windows)
        working-directory: src-tauri
        run: cargo check --all-targets --color never

  # Test d'interface : GestiMarket en mode serveur sous Xvfb, piloté par Playwright
  # (PC et tablette sur le réseau local, téléphone 390 px par un faux tunnel Cloudflare).
  # Les captures sont publiées dans une pré-release « e2e-N » (dépôt public : lisibles sans connexion).
  e2e:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/essai-mobile'
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK, Xvfb, ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb imagemagick gdb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Playwright (Chromium)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Compilation (debug)
        run: npx tauri build --debug --no-bundle
      - name: Lancement en mode serveur sous Xvfb
        run: |
          mkdir -p ~/.local/share/com.gestimarket.app
          echo '{"mode":"server","poste_name":"Caisse 1","port":7878,"server_url":""}' > ~/.local/share/com.gestimarket.app/network.json
          Xvfb :99 -screen 0 1366x850x24 > /dev/null 2>&1 &
          sleep 2
          # Si le poste serveur s'arrête net, un fichier core permet de lire sa pile d'appels (étape suivante).
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
          ulimit -c unlimited
          DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 nohup src-tauri/target/debug/gestimarket > e2e-app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:7878/api/ping && break; sleep 2; done
          curl -sf http://127.0.0.1:7878/api/ping || (cat e2e-app.log; exit 1)
      - name: Scénario Playwright
        run: LAN_IP=$(hostname -I | awk '{print $1}') node e2e/run.mjs
      - name: Capture de la fenêtre du poste serveur (Xvfb)
        if: always()
        run: |
          mkdir -p e2e/out
          DISPLAY=:99 import -window root e2e/out/00-fenetre-serveur-xvfb.png || true
          montage e2e/out/0*.png -tile 4x -geometry 480x+8+8 -background '#eeeeee' e2e/out/apercu.png || true
          cp e2e-app.log e2e/out/ || true
      - name: Pile d'appels si le poste serveur s'est arrêté
        if: always()
        run: |
          for c in /tmp/core.*; do
            [ -f "$c" ] || continue
            sudo chmod a+r "$c"
            gdb -q -batch -ex "bt 60" -ex "info threads" -ex "thread apply all bt 8" src-tauri/target/debug/gestimarket "$c" > e2e/out/pile-serveur.txt 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-captures
          path: e2e/out
      - name: Publier les captures (pré-release e2e)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "e2e-${{ github.run_number }}" e2e/out/* --target "${{ github.sha }}" --title "Test d'interface ${{ github.run_number }}" --notes "Captures Playwright sous Xvfb, résultats dans results.json." --prerelease

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GestiMarket ${{ github.ref_name }}"
          releaseBody: "Installateurs de GestiMarket. Sous Windows, utilisez le fichier .msi ou -setup.exe."
          releaseDraft: false
          args: ${{ matrix.args }}
