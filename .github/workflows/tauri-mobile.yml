# Application GestiMarket pour Android et iOS (Tauri), compilée et essayée sur GitHub, rien sur le PC.
# - android-test : APK debug (x86_64) installé dans un émulateur Android et piloté par Playwright (e2e/android.mjs).
# - android-9    : le même APK sur un émulateur Android 9 (ancien moteur web, comme BlueStacks) : il doit démarrer.
# - android-apk  : APK à installer (arm64 et armv7 pour les téléphones, x86_64 pour BlueStacks, émulateurs
#                  et Chromebook), signé avec la clé de la boutique
#                  (secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD ; sinon clé d'essai, nom « essai »).
# - ios          : compilé pour le simulateur d'iPhone (sans compte Apple), lancé, capture d'écran.
# Résultats et APK publiés dans une pré-release « mobile-N » (dépôt public : lisibles sans connexion) ;
# sur une étiquette v*, l'APK rejoint aussi la release de la version.
name: Android et iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "e2e/android.mjs"
      - "e2e/mobile.mjs"
      - "public/**"
      - "scripts/mobile/**"
      - ".github/workflows/tauri-mobile.yml"
  workflow_dispatch:

concurrency:
  group: tauri-mobile-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NDK_VERSION: "27.2.12479018"
  BUILD_TOOLS: "35.0.0"

jobs:
  android-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # SDK Android déjà installé sur les machines Ubuntu de GitHub ($ANDROID_HOME) : on ajoute ce qui manque.
      - name: NDK et outils Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "platform-tools" "build-tools;$BUILD_TOOLS" 2>&1 | tail -3
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME/ndk"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-debug
      - run: npm ci
      - name: Projet Android
        run: |
          set -o pipefail
          bash scripts/mobile/android-init.sh 2>&1 | tee android-init.log
      - name: Compilation (debug, x86_64 pour l'émulateur)
        run: |
          set -o pipefail
          npx tauri android build --debug --apk --target x86_64 --ci 2>&1 | tee android-build.log
          mkdir -p e2e/out-android
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK : $APK"
          cp "$APK" e2e/out-android/GestiMarket-android-test-x86_64.apk
      - name: Erreurs de compilation (annotations)
        if: failure()
        run: |
          touch android-init.log android-build.log
          msg=$(grep -E -B2 -A14 '^(error(\[E[0-9]+\])?:|FAILURE:|e: |\* What went wrong)' android-build.log | head -150 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$msg" ] || msg=$( (tail -25 android-init.log; echo ---; tail -40 android-build.log) | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Compilation Android::${msg:-voir le journal}"
          mkdir -p e2e/out-android out
          cp android-init.log android-build.log e2e/out-android/ 2>/dev/null || true
          cp android-init.log out/android-apk-init.log 2>/dev/null || true
          cp android-build.log out/android-apk-build.log 2>/dev/null || true
      - name: KVM pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Playwright (pilote Android)
        run: npm i --no-save playwright@1.49.1
      - name: Émulateur Android et scénario
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Image Android sans les services Google : dans l'émulateur, leur arrêt (mémoire) tuait l'application.
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            echo "émulateur démarré : $(date -u +%T)" >> e2e/out-android/progress.txt
            adb logcat -G 16M || true
            adb logcat -c || true
            timeout 300 adb install -r e2e/out-android/GestiMarket-android-test-x86_64.apk
            echo "APK installé : $(date -u +%T)" >> e2e/out-android/progress.txt
            adb shell pm grant com.gestimarket.app android.permission.CAMERA || true
            timeout 900 node e2e/android.mjs || { adb logcat -d > e2e/out-android/logcat.txt; adb logcat -d -b crash > e2e/out-android/crash.txt; exit 1; }
            adb logcat -d > e2e/out-android/logcat.txt || true
      - name: Journal Android si échec
        if: failure()
        run: |
          [ -f e2e/out-android/logcat.txt ] || exit 0
          msg=$( (cat e2e/out-android/crash.txt 2>/dev/null | head -40; grep -E ' GestiMarket|RustStdoutStderr|FATAL|panicked|AndroidRuntime|ANR in|Process com.gestimarket.app' e2e/out-android/logcat.txt | grep -v -E 'AppsFilter|s_glBindAttribLocation' | tail -40) | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=Journal Android (logcat)::${msg:-rien}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-test
          path: e2e/out-android

  # Ancien Android (9, moteur web d'origine, sans mise à jour) : GestiMarket doit démarrer ou, à défaut,
  # afficher un message clair. Écran lu par l'accessibilité d'Android (scripts/mobile/boot-check.sh).
  android-9:
    needs: android-test
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: android-test
          path: e2e/out-android
      - name: KVM pour l'émulateur
        run: |
          ls e2e/out-android/GestiMarket-android-test-x86_64.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android 9 et démarrage
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_3a
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/mobile/boot-check.sh e2e/out-android/GestiMarket-android-test-x86_64.apk e2e/out-android9
      - name: Résultat
        if: always()
        run: |
          [ -f e2e/out-android9/android-ancien.txt ] || exit 0
          echo "::notice title=Android 9::$(head -3 e2e/out-android9/android-ancien.txt | tr '\n' ' ')"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-9
          path: e2e/out-android9

  android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # SDK Android déjà installé sur les machines Ubuntu de GitHub ($ANDROID_HOME) : on ajoute ce qui manque.
      - name: NDK et outils Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "platform-tools" "build-tools;$BUILD_TOOLS" 2>&1 | tail -3
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME/ndk"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-release
      - run: npm ci
      - name: Manuels rangés dans l'application (dernière édition publiée)
        run: node scripts/fetch-manuals.mjs
      - name: Projet Android
        run: |
          set -o pipefail
          bash scripts/mobile/android-init.sh 2>&1 | tee android-init.log
      - name: Compilation (téléphones arm64 et armv7, BlueStacks et émulateurs x86_64)
        run: |
          set -o pipefail
          npx tauri android build --apk --target aarch64 armv7 x86_64 --ci 2>&1 | tee android-build.log
      - name: Erreurs de compilation (annotations)
        if: failure()
        run: |
          touch android-init.log android-build.log
          msg=$(grep -E -B2 -A14 '^(error(\[E[0-9]+\])?:|FAILURE:|e: |\* What went wrong)' android-build.log | head -150 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$msg" ] || msg=$( (tail -25 android-init.log; echo ---; tail -40 android-build.log) | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Compilation Android::${msg:-voir le journal}"
          mkdir -p e2e/out-android out
          cp android-init.log android-build.log e2e/out-android/ 2>/dev/null || true
          cp android-init.log out/android-apk-init.log 2>/dev/null || true
          cp android-build.log out/android-apk-build.log 2>/dev/null || true
      - name: Signature de l'APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK non signé : $APK"
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.p12"
            NAME="GestiMarket_${V}_android.apk"
          else
            echo "::warning title=Clé Android::secrets ANDROID_KEYSTORE_* absents : APK signé avec une clé d'essai (à ne pas distribuer)."
            export ANDROID_KEYSTORE_PASSWORD="essai-gestimarket"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.p12" -storetype PKCS12 -alias gestimarket -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -dname "CN=GestiMarket essai" > /dev/null
            NAME="GestiMarket_${V}_android_essai.apk"
          fi
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-key-alias gestimarket \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --out "out/$NAME" aligned.apk
          rm -f "$RUNNER_TEMP/ks.p12"
          "$BT/apksigner" verify --print-certs "out/$NAME" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          cleartext=$("$BT/aapt" dump xmltree "out/$NAME" AndroidManifest.xml | grep -i usesCleartextTraffic || true)
          echo "$cleartext"
          echo "$cleartext" | grep -q '0xffffffff' || { echo "::error title=APK Android::http du réseau local non autorisé"; exit 1; }
          "$BT/aapt" dump badging "out/$NAME" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
          ls -la out
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-apk
          path: out/

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios,x86_64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios-sim
      - run: npm ci
      - name: Projet iOS
        run: |
          set -o pipefail
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen
          npx tauri ios init --ci --skip-targets-install 2>&1 | tee ios-build.log
          npx tauri icon src-tauri/icons/icon.png
          git checkout -- src-tauri/icons
          ls src-tauri/gen/apple
      - name: Compilation (simulateur d'iPhone, sans signature)
        run: |
          set -o pipefail
          mkdir -p e2e/out-ios
          if ! npx tauri ios build --debug --target aarch64-sim --ci 2>&1 | tee -a ios-build.log; then
            echo "::warning title=iOS::tauri ios build a échoué, essai direct avec xcodebuild (sans signature)"
            PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
            SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c "import sys,json;print([s for s in json.load(sys.stdin)['project']['schemes'] if s.endswith('_iOS')][0])")
            xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration debug -sdk iphonesimulator -arch arm64 \
              -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee -a ios-build.log | tail -40
          fi
          set +e +o pipefail
          # tauri ios build : src-tauri/gen/apple/build/arm64-sim/GestiMarket.app ; xcodebuild : build-ios/…/debug-iphonesimulator.
          APP=$(ls -d src-tauri/gen/apple/build/arm64-sim/*.app 2>/dev/null | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple build-ios -name "*.app" -type d 2>/dev/null | grep -v -i "\.xctest" | head -1)
          echo "Application : $APP"
          [ -n "$APP" ] && echo "APP=$APP" >> "$GITHUB_ENV"
          test -n "$APP"
      - name: Erreurs de compilation (annotations)
        if: failure()
        run: |
          touch ios-build.log
          mkdir -p e2e/out-ios && cp ios-build.log e2e/out-ios/
          msg=$(grep -E -B3 -A12 '(error(\[E[0-9]+\])?:|\*\* BUILD FAILED|Error |failed)' ios-build.log | head -150 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$msg" ] || msg=$(tail -60 ios-build.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Compilation iOS::${msg:-voir le journal}"
      - name: Simulateur d'iPhone
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; l=sorted((k,x['udid']) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')); print(l[-1][1])")
          echo "Simulateur : $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > /dev/null
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          echo "Identifiant : $BID"
          xcrun simctl launch "$DEV" "$BID"
          sleep 45
          xcrun simctl io "$DEV" screenshot e2e/out-ios/i-01-lancement.png
          if xcrun simctl spawn "$DEV" launchctl list | grep -q "$BID"; then
            echo '{"checks":[{"name":"iOS : application lancée dans le simulateur","ok":true}]}' > e2e/out-ios/results.json
          else
            echo '{"checks":[{"name":"iOS : application lancée dans le simulateur","ok":false}]}' > e2e/out-ios/results.json
            xcrun simctl spawn "$DEV" log show --last 3m --predicate 'process CONTAINS[c] "gestimarket"' 2>/dev/null | tail -60 > e2e/out-ios/journal.txt || true
            echo "::error title=iOS::l'application s'est arrêtée dans le simulateur (voir journal.txt)"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-sim
          path: e2e/out-ios

  publish:
    needs: [android-test, android-9, android-apk, ios]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Pré-release « mobile-N » (captures, résultats, APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p files
          printf 'android-test: %s\nandroid-9: %s\nandroid-apk: %s\nios: %s\n' "${{ needs.android-test.result }}" "${{ needs.android-9.result }}" "${{ needs.android-apk.result }}" "${{ needs.ios.result }}" > files/resume.txt
          for d in dist/*/; do
            n=$(basename "$d")
            for f in "$d"*; do [ -f "$f" ] && [ -s "$f" ] && cp "$f" "files/$( [ "$(basename "$f")" = results.json ] && echo "$n-results.json" || basename "$f")"; done
          done
          ls -la files
          gh release create "mobile-${{ github.run_number }}" files/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Android et iOS ${{ github.run_number }}" \
            --notes "Android : test dans l'émulateur (${{ needs.android-test.result }}), APK (${{ needs.android-apk.result }}). iOS simulateur : ${{ needs.ios.result }}." \
            --prerelease
      - name: APK dans la release de la version
        if: startsWith(github.ref, 'refs/tags/v') && needs.android-apk.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "${{ github.ref_name }}" dist/android-apk/*.apk --repo "${{ github.repository }}" --clobber
