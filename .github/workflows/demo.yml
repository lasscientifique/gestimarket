# Tournage de la démonstration GestiMarket (publicité) : vrai logiciel sur une boutique d'exemple,
# filmé en 1920x1080 sous Xvfb (voir e2e/demo.mjs). Déclenché par un tag « demo-* » ou à la main.
name: demo

on:
  push:
    tags: ["demo-*"]
  workflow_dispatch:

jobs:
  tournage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK, Xvfb, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb ffmpeg fonts-noto-color-emoji
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Playwright (Chromium)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Compilation (debug)
        run: npx tauri build --debug --no-bundle
      - name: Lancement en mode serveur sous Xvfb
        run: |
          mkdir -p ~/.local/share/com.gestimarket.app
          echo '{"mode":"server","poste_name":"Caisse 1","port":7878,"server_url":""}' > ~/.local/share/com.gestimarket.app/network.json
          Xvfb :99 -screen 0 1366x850x24 > /dev/null 2>&1 &
          Xvfb :100 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 nohup src-tauri/target/debug/gestimarket > demo-app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:7878/api/ping && break; sleep 2; done
          curl -sf http://127.0.0.1:7878/api/ping || (cat demo-app.log; exit 1)
      - name: Tournage
        run: DEMO_DISPLAY=:100 node e2e/demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: demo/out
      - name: Publier le tournage (pré-release demo)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "tournage-${{ github.run_number }}" demo/out/* --target "${{ github.sha }}" --title "Tournage démo ${{ github.run_number }}" --notes "Film du logiciel (ecran.mp4), repères et captures." --prerelease
