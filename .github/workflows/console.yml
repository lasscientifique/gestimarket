# Console Eden Dev (logiciel d'administration réservé à Eden Dev, dossier console/), compilée sur GitHub.
# - À chaque changement de console/ sur main : programme d'installation Windows et APK Android d'essai,
#   gardés comme « artifacts » de l'exécution (rien n'est publié).
# - Sur une étiquette « console-v* » (ex. console-v1.0.0) : version publiée à part de GestiMarket, en
#   pré-release (jamais « la dernière version » du dépôt, que GestiMarket lit pour ses propres mises à jour) :
#     · programme d'installation Windows signé pour la mise à jour en un clic (même clé que GestiMarket) ;
#     · APK Android ;
#     · latest.json copié dans la pré-release fixe « console », lue par la console pour se mettre à jour.
name: Console Eden Dev

on:
  push:
    branches: [main]
    tags: ["console-v*"]
    paths:
      - "console/**"
      - ".github/workflows/console.yml"
  workflow_dispatch:

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NDK_VERSION: "27.2.12479018"
  BUILD_TOOLS: "35.0.0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - name: Programme d'installation d'essai (sans publication)
        if: ${{ !startsWith(github.ref, 'refs/tags/console-v') }}
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles nsis 2>&1 | tee build.log
      - name: Erreurs de compilation (annotations)
        if: failure()
        shell: bash
        run: |
          touch build.log
          msg=$(grep -E -B2 -A14 '^(error(\[E[0-9]+\])?:|Error )' build.log | head -120 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$msg" ] || msg=$(tail -40 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Compilation Windows::${msg:-voir le journal}"
      - uses: actions/upload-artifact@v6
        if: ${{ !startsWith(github.ref, 'refs/tags/console-v') }}
        with:
          name: console-windows
          path: console/src-tauri/target/release/bundle/nsis/*.exe
      - name: Nouveautés de la version
        id: notes
        if: startsWith(github.ref, 'refs/tags/console-v')
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/^-----BEGIN PGP/,$d')
          [ -n "$notes" ] || notes="Console Eden Dev, réservée à l'équipe Eden Dev. Sous Windows : le fichier -setup.exe ; sur Android : l'APK."
          { echo "body<<GM_NOTES_EOF"; echo "$notes"; echo "GM_NOTES_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/console-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: console
          tagName: ${{ github.ref_name }}
          releaseName: "Console Eden Dev ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          args: --bundles nsis --config src-tauri/tauri.updater.conf.json
      # Canal de mise à jour de la console : pré-release fixe « console » (jamais la « dernière version »).
      - name: Mise à jour en un clic (latest.json de la console)
        if: startsWith(github.ref, 'refs/tags/console-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p upd
          gh release download "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" -p latest.json -D upd --clobber
          cat upd/latest.json
          grep -q '"windows-x86_64' upd/latest.json || { echo "::error title=Mise à jour::latest.json sans Windows"; exit 1; }
          gh release view console --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || gh release create console --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
                 --title "Console Eden Dev (canal de mise à jour)" \
                 --notes "Fichier lu par la Console Eden Dev pour savoir s'il existe une nouvelle version. Les programmes d'installation sont dans les versions « console-v… »."
          gh release upload console upd/latest.json --repo "${{ github.repository }}" --clobber

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: NDK et outils Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "platform-tools" "build-tools;$BUILD_TOOLS" 2>&1 | tail -3
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri
          key: console-android
      - run: npm ci
      - name: Projet Android
        run: |
          set -o pipefail
          bash scripts/android-init.sh 2>&1 | tee android-init.log
      - name: Compilation (téléphones arm64 et armv7, émulateurs x86_64)
        run: |
          set -o pipefail
          npx tauri android build --apk --target aarch64 armv7 x86_64 --ci 2>&1 | tee android-build.log
      - name: Erreurs de compilation (annotations)
        if: failure()
        run: |
          touch android-init.log android-build.log
          msg=$(grep -E -B2 -A14 '^(error(\[E[0-9]+\])?:|FAILURE:|e: |\* What went wrong)' android-build.log | head -150 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$msg" ] || msg=$( (tail -25 android-init.log; echo ---; tail -40 android-build.log) | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Compilation Android::${msg:-voir le journal}"
      - name: Signature de l'APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK non signé : $APK"
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.p12"
            NAME="Console_Eden_Dev_${V}_android.apk"
          else
            echo "::warning title=Clé Android::secrets ANDROID_KEYSTORE_* absents : APK signé avec une clé d'essai."
            export ANDROID_KEYSTORE_PASSWORD="essai-console-eden-dev"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.p12" -storetype PKCS12 -alias gestimarket -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -dname "CN=Console Eden Dev essai" > /dev/null
            NAME="Console_Eden_Dev_${V}_android_essai.apk"
          fi
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-key-alias gestimarket \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --out "out/$NAME" aligned.apk
          rm -f "$RUNNER_TEMP/ks.p12"
          "$BT/apksigner" verify --print-certs "out/$NAME" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          "$BT/aapt" dump badging "out/$NAME" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
          ls -la out
      - uses: actions/upload-artifact@v6
        with:
          name: console-android
          path: console/out/*.apk
      - name: APK dans la version publiée
        if: startsWith(github.ref, 'refs/tags/console-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "${GITHUB_REF_NAME}" out/*.apk --repo "${{ github.repository }}" --clobber
