# Tests du code personnalisé de l'application mobile FlutterFlow (projet gesti-market-ywxut8).
# Le code testé est celui collé dans FlutterFlow (supabase/flutterflow/), assemblé par assemble.py.
# Mêmes versions que le code généré par FlutterFlow : go_router 12.1.3.
name: gestimarket_flutterflow_test
description: Tests du bouton flottant MenuFlottant et de la fonction isServerActive.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: 12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
